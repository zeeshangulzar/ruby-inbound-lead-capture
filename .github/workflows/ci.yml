name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # EOLRails is skipped deliberately: Rails 7.2 support ends 2026-08-09 and
      # this app pins 7.2 to stay in step with the other Mailtrap Ruby examples,
      # so the warning is known and not actionable here. Every other check still
      # fails the build. Drop this flag once the Rails version moves.
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --except EOLRails

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The suite stubs every outbound HTTP call, so no Mailtrap, Anthropic or
      # HubSpot credentials are needed here.
      - name: Run tests
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:test:prepare
          bundle exec rspec
